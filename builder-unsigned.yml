appId: com.dms.app
productName: DMS
directories:
  output: dist
  buildResources: build
files:
  - "**/*"
  - "!node_modules/.cache"
  - "!*.log"
  - "!dist"
  - "!*.yml"
  - "!*.md"
  - "!_t_*"
  - "!sign.js"
  - "!config/userData"
win:
  target:
    - nsis
    - portable
  icon: assets/icons/icon.ico
  sign: ./sign.js
